<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 8 Chemistry Review Quiz - Ms. Theres</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #4a3b40;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(219, 112, 147, 0.15);
            border: 2px solid #f8c8dc;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #d81b60;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .header h3 {
            color: #c2185b;
            margin-top: 5px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .teacher-tag {
            display: inline-block;
            background-color: #f8bbd0;
            color: #880e4f;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .question-card {
            background-color: #ffffff;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(219, 112, 147, 0.1);
            border: 1px solid #f8c8dc;
            transition: border-left 0.3s ease;
        }
        .question-card h4 {
            margin-top: 0;
            color: #880e4f;
        }
        .options {
            list-style-type: none;
            padding-left: 0;
        }
        .options li {
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            padding: 10px 14px;
            border: 1px solid #f8c8dc;
            border-radius: 8px;
            cursor: pointer;
            background-color: #fffafc;
            transition: all 0.2s ease;
        }
        .options label:hover {
            background-color: #fce4ec;
            border-color: #f48fb1;
        }
        .options input[type="radio"] {
            margin-right: 10px;
            accent-color: #e91e63;
        }
        .feedback {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
        .correct-feedback {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .incorrect-feedback {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .btn-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }
        .btn {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(233, 30, 99, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            margin: 0 8px;
        }
        .btn:hover {
            background-color: #d81b60;
            transform: translateY(-1px);
        }
        .btn-reset {
            background-color: #ff80ab;
        }
        .btn-reset:hover {
            background-color: #ff4081;
        }
        #score-board {
            display: none;
            background-color: #ad1457;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(173, 20, 87, 0.25);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SMP SWASTA INTEGRITAS BANGSA</h1>
        <h3>Grade 8 Chemistry - Mid-Summative Assessment Review</h3>
        <div class="teacher-tag">Teacher: Ms. Theres</div>
        <p>Both questions and answer choices are automatically shuffled on each visit or reset!</p>
    </div>

    <div id="score-board"></div>

    <form id="quiz-form">
        <div id="quiz-container"></div>

        <div class="btn-container">
            <button type="button" class="btn" onclick="checkAnswers()">Submit Answers</button>
            <button type="button" class="btn btn-reset" onclick="initQuiz()">Shuffle & Restart</button>
        </div>
    </form>

    <script>
        const rawQuestions = [
            {
                q: "The ion produced by acids when they dissolve in water is:",
                options: ["OH⁻", "H⁺", "Na⁺", "Cl⁻"],
                correct: 1,
                exp: "Acids release hydrogen ions (H⁺) when dissolved in water."
            },
            {
                q: "The pH value of a neutral solution is:",
                options: ["9", "3", "7", "12"],
                correct: 2,
                exp: "A neutral solution (like pure water) has a pH of 7."
            },
            {
                q: "Which equation represents the reaction between an acid and a reactive metal?",
                options: [
                    "metal + acid → salt + hydrogen",
                    "metal + acid → salt + oxygen",
                    "metal + acid → water + carbon dioxide",
                    "metal + acid → metal hydroxide + hydrogen"
                ],
                correct: 0,
                exp: "Metal + Acid → Salt + Hydrogen gas."
            },
            {
                q: "Which substance is an alkali?",
                options: ["Copper(II) oxide", "Zinc oxide", "Sodium hydroxide", "Copper(II) carbonate"],
                correct: 2,
                exp: "Sodium hydroxide is a soluble base (alkali)."
            },
            {
                q: "Which gas is produced when an acid reacts with a carbonate?",
                options: ["Hydrogen", "Oxygen", "Nitrogen", "Carbon dioxide"],
                correct: 3,
                exp: "Acid + Carbonate → Salt + Water + Carbon Dioxide gas."
            },
            {
                q: "Which reaction produces a salt and water only?",
                options: ["Acid + metal", "Acid + alkali", "Metal + water", "Salt + metal"],
                correct: 1,
                exp: "Acid + Alkali → Salt + Water (Neutralisation)."
            },
            {
                q: "A student places blue litmus paper into a solution. The paper turns red. What can be concluded?",
                options: ["The solution is alkaline.", "The solution is acidic.", "The solution is neutral.", "The solution is pure water."],
                correct: 1,
                exp: "Blue litmus turns red in acidic conditions."
            },
            {
                q: "A solution has a pH of 4. Another solution has a pH of 6. Which statement is correct?",
                options: ["The pH 6 solution is more acidic.", "The pH 4 solution is more acidic.", "Both solutions are neutral.", "Both solutions have the same acidity."],
                correct: 1,
                exp: "Lower pH numbers indicate stronger acidity (pH 4 is more acidic than pH 6)."
            },
            {
                q: "Which word equation is correct for the reaction of an acid and a metal carbonate?",
                options: [
                    "acid + carbonate → salt + hydrogen",
                    "acid + carbonate → salt + water + carbon dioxide",
                    "acid + carbonate → salt + oxygen",
                    "acid + carbonate → water + hydrogen"
                ],
                correct: 1,
                exp: "Acid + Carbonate → Salt + Water + Carbon Dioxide."
            },
            {
                q: "Which salt is soluble in water?",
                options: ["Copper(II) sulfate", "Copper(II) carbonate", "Copper(II) oxide", "Calcium carbonate"],
                correct: 0,
                exp: "Copper(II) sulfate is soluble in water, whereas carbonates and oxides of copper/calcium are generally insoluble."
            },
            {
                q: "Which statement correctly describes an exothermic reaction?",
                options: [
                    "It absorbs thermal energy from the surroundings.",
                    "It transfers thermal energy to the surroundings.",
                    "It always causes the temperature to decrease.",
                    "It has a positive enthalpy change."
                ],
                correct: 1,
                exp: "Exothermic reactions release/transfer thermal energy to the surroundings."
            },
            {
                q: "Which reaction is endothermic?",
                options: ["Combustion of wood", "Respiration", "Neutralisation of an acid and an alkali", "Thermal decomposition of calcium carbonate"],
                correct: 3,
                exp: "Thermal decomposition absorbs energy (heat) to break down compounds, so it is endothermic."
            },
            {
                q: "Dissolving ammonium chloride in water causes the temperature to fall from 28°C to 22°C. What does this show?",
                options: ["Thermal energy is released.", "The process is exothermic.", "Thermal energy is absorbed.", "The process has a negative ΔH."],
                correct: 2,
                exp: "A drop in temperature indicates heat was absorbed from surroundings (endothermic)."
            },
            {
                q: "The enthalpy change (ΔH) of a chemical reaction is defined as:",
                options: [
                    "The temperature of the reactants",
                    "The difference in energy content between products and reactants",
                    "The energy required to start a reaction only",
                    "The total mass of the products"
                ],
                correct: 1,
                exp: "Enthalpy change (ΔH) = Energy of products - Energy of reactants."
            },
            {
                q: "What does activation energy represent?",
                options: [
                    "The total energy released by a reaction.",
                    "The minimum energy needed for a reaction to start.",
                    "The energy stored only in the products.",
                    "The overall temperature change of the surroundings."
                ],
                correct: 1,
                exp: "Activation energy is the minimum energy required for colliding particles to react."
            },
            {
                q: "A reaction has an enthalpy change of ΔH = +85 kJ. Which statement is correct?",
                options: [
                    "The reaction is exothermic and releases 85 kJ.",
                    "The reaction is endothermic and absorbs 85 kJ.",
                    "The reaction is exothermic and absorbs 85 kJ.",
                    "The reaction is neutral and releases 85 kJ."
                ],
                correct: 1,
                exp: "Positive ΔH (+85 kJ) means the reaction is endothermic and absorbs energy."
            },
            {
                q: "Which statement about bond breaking is correct?",
                options: [
                    "Energy is released during bond breaking.",
                    "Energy is absorbed during bond breaking.",
                    "No energy change occurs during bond breaking.",
                    "Bonds break spontaneously without any energy involvement."
                ],
                correct: 1,
                exp: "Bond breaking requires energy input (endothermic process)."
            },
            {
                q: "Methane reacts with steam: CH₄(g) + H₂O(g) → 3H₂(g) + CO(g), ΔH = +314 kJ. Which conclusion is correct?",
                options: [
                    "The reaction releases 314 kJ of thermal energy.",
                    "The reaction is exothermic.",
                    "The products have less energy than the reactants.",
                    "The reaction absorbs 314 kJ of thermal energy."
                ],
                correct: 3,
                exp: "Positive ΔH (+314 kJ) shows that 314 kJ of energy is absorbed."
            },
            {
                q: "Photosynthesis is an endothermic reaction. What happens to energy during photosynthesis?",
                options: [
                    "Energy is absorbed from light.",
                    "Energy is released to the surroundings.",
                    "No energy is involved.",
                    "Energy is destroyed."
                ],
                correct: 0,
                exp: "Photosynthesis absorbs light energy from the surroundings."
            },
            {
                q: "The bond energy of an H–H bond is 436 kJ/mol. How much energy is needed to break all the H–H bonds in 2H₂ (2 moles of H₂ molecules)?",
                options: ["436 kJ", "654 kJ", "872 kJ", "1,744 kJ"],
                correct: 2,
                exp: "2 moles of H₂ contains 2 H–H bonds = 2 × 436 kJ = 872 kJ."
            },
            {
                q: "Which ion is responsible for alkaline properties in an aqueous solution?",
                options: ["H⁺", "OH⁻", "Na⁺", "SO₄²⁻"],
                correct: 1,
                exp: "Hydroxide ions (OH⁻) are produced by alkalis in water."
            },
            {
                q: "Which substance is used in spacecraft to absorb carbon dioxide produced by astronauts?",
                options: ["Sodium chloride", "Sodium hydroxide", "Calcium sulfate", "Hydrochloric acid"],
                correct: 1,
                exp: "Sodium hydroxide absorbs CO₂ gas in spacecraft rebreathers."
            },
            {
                q: "High concentrations of carbon dioxide inside a spacecraft can be dangerous to astronauts because it can cause:",
                options: ["Explosions", "Rapid freezing", "Toxicity and breathing difficulties", "Over-oxygenation of blood"],
                correct: 2,
                exp: "High CO₂ concentrations cause breathing issues and toxicity."
            },
            {
                q: "When red litmus paper is dipped into sodium hydroxide solution, it turns:",
                options: ["Red", "Blue", "Green", "Colorless"],
                correct: 1,
                exp: "Red litmus paper turns blue in alkaline solutions like NaOH."
            },
            {
                q: "What color does universal indicator turn in a strongly acidic solution (e.g., pH 1)?",
                options: ["Purple", "Green", "Red", "Yellow"],
                correct: 2,
                exp: "Universal indicator turns red in strongly acidic solutions (pH 1-2)."
            },
            {
                q: "A student mixes two chemicals and observes a temperature increase from 25°C to 38°C. What type of reaction is this?",
                options: ["Endothermic", "Exothermic", "Thermal decomposition", "Reversible"],
                correct: 1,
                exp: "A temperature increase indicates energy was released (exothermic)."
            },
            {
                q: "When an exothermic reaction occurs in a beaker, what happens to the energy in the surroundings?",
                options: [
                    "Energy is absorbed from the surroundings.",
                    "Energy is transferred to the surroundings, raising their temperature.",
                    "The energy of the surroundings remains completely unchanged.",
                    "Thermal energy in the surroundings converts to chemical energy."
                ],
                correct: 1,
                exp: "Exothermic reactions release energy into surroundings, raising their temperature."
            },
            {
                q: "Consider the reaction: 2H₂ + O₂ → 2H₂O.<br>Given bond energies: H–H = 436 kJ/mol, O=O = 496 kJ/mol.<br>Calculate the total energy needed to break all bonds in the reactants (2 moles of H–H and 1 mole of O=O).",
                options: ["932 kJ", "1,368 kJ", "1,852 kJ", "496 kJ"],
                correct: 1,
                exp: "Energy absorbed = (2 × 436) + (1 × 496) = 872 + 496 = 1368 kJ."
            },
            {
                q: "Consider the reaction: 2H₂ + O₂ → 2H₂O.<br>Each water molecule (H₂O) has 2 O–H bonds, so 2H₂O contains 4 O–H bonds.<br>Given O–H bond energy = 463 kJ/mol, calculate the total energy released when these bonds are formed.",
                options: ["926 kJ", "1,368 kJ", "1,852 kJ", "2,315 kJ"],
                correct: 2,
                exp: "Energy released = 4 × O-H = 4 × 463 = 1852 kJ."
            },
            {
                q: "For the reaction 2H₂ + O₂ → 2H₂O, energy absorbed to break bonds = 1368 kJ, and energy released forming bonds = 1852 kJ.<br>Is the reaction overall exothermic or endothermic, and why?",
                options: [
                    "Endothermic, because energy absorbed > energy released.",
                    "Exothermic, because energy released > energy absorbed.",
                    "Endothermic, because temperature decreases.",
                    "Exothermic, because energy absorbed > energy released."
                ],
                correct: 1,
                exp: "Since energy released (1852 kJ) > energy absorbed (1368 kJ), the reaction is exothermic."
            },
            {
                q: "Which of the following statements regarding bond making is correct?",
                options: [
                    "Bond making is an endothermic process.",
                    "Bond making releases energy (exothermic).",
                    "Bond making requires activation energy only.",
                    "Bond making does not involve any energy transfer."
                ],
                correct: 1,
                exp: "Bond making is an exothermic process (releases energy)."
            },
            {
                q: "Hydrochloric acid reacts with sodium hydroxide to form sodium chloride and water. What name is given to this type of reaction?",
                options: ["Thermal decomposition", "Neutralisation", "Combustion", "Oxidation"],
                correct: 1,
                exp: "Reaction between an acid and a base/alkali is neutralisation."
            },
            {
                q: "Which salt is produced when magnesium reacts with sulfuric acid?",
                options: ["Magnesium chloride", "Magnesium nitrate", "Magnesium sulfate", "Magnesium carbonate"],
                correct: 2,
                exp: "Magnesium + Sulfuric acid → Magnesium sulfate + Hydrogen."
            },
            {
                q: "Hydrochloric acid produces salts known as:",
                options: ["Sulfates", "Chlorides", "Nitrates", "Carbonates"],
                correct: 1,
                exp: "Hydrochloric acid forms chloride salts."
            },
            {
                q: "In an energy level diagram for an exothermic reaction, how are the products positioned relative to the reactants?",
                options: [
                    "Products are higher than reactants.",
                    "Products are lower than reactants.",
                    "Products and reactants are at the same level.",
                    "Products start at zero energy always."
                ],
                correct: 1,
                exp: "In exothermic reactions, products have less chemical energy than reactants."
            },
            {
                q: "In an endothermic reaction, the sign of the enthalpy change (ΔH) is always:",
                options: ["Negative (-)", "Positive (+)", "Zero", "Variable depending on pressure"],
                correct: 1,
                exp: "Endothermic reactions have a positive enthalpy change (+ΔH)."
            },
            {
                q: "Which of the following is a TRUE statement regarding sodium chloride (table salt) in spacecraft system interactions?",
                options: [
                    "Sodium chloride absorbs carbon dioxide to keep air clean.",
                    "Sodium chloride reacts with carbon dioxide to release oxygen.",
                    "Sodium chloride does NOT react with carbon dioxide to remove it from air.",
                    "Sodium chloride is used as a liquid fuel in rockets."
                ],
                correct: 2,
                exp: "Sodium chloride (salt) does NOT react with CO₂; sodium hydroxide is used instead."
            },
            {
                q: "What happens during cellular respiration in astronauts' bodies?",
                options: [
                    "Oxygen is produced and carbon dioxide is consumed.",
                    "Glucose and oxygen are used to produce energy, releasing carbon dioxide and water.",
                    "Nitrogen is converted into carbon dioxide.",
                    "Heat is absorbed from surroundings to make glucose."
                ],
                correct: 1,
                exp: "Respiration consumes glucose + oxygen to produce CO₂ + water + energy."
            },
            {
                q: "A solution has a pH of 13. How would you classify this solution?",
                options: ["Weak acid", "Strong acid", "Neutral", "Strong alkali"],
                correct: 3,
                exp: "pH values from 12-14 indicate a strong alkali."
            },
            {
                q: "Nitric acid reacts with potassium hydroxide. What is the formula of the salt formed?",
                options: ["KNO₃", "KCl", "K₂SO₄", "NaNO₃"],
                correct: 0,
                exp: "Nitric acid + Potassium hydroxide → Potassium nitrate (KNO₃) + Water."
            }
        ];

        let processedQuestions = [];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            document.getElementById("score-board").style.display = "none";
            
            let shuffledQ = shuffle(JSON.parse(JSON.stringify(rawQuestions)));

            processedQuestions = shuffledQ.map((item) => {
                let optionsWithIndex = item.options.map((opt, idx) => ({
                    text: opt,
                    isCorrect: idx === item.correct
                }));
                
                let shuffledOpts = shuffle(optionsWithIndex);
                
                return {
                    q: item.q,
                    options: shuffledOpts,
                    exp: item.exp
                };
            });

            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = "";

            const labels = ["A", "B", "C", "D"];

            processedQuestions.forEach((item, qIdx) => {
                let card = document.createElement("div");
                card.className = "question-card";
                card.id = `q${qIdx}-card`;

                let title = document.createElement("h4");
                title.innerHTML = `${qIdx + 1}. ${item.q}`;
                card.appendChild(title);

                let ul = document.createElement("ul");
                ul.className = "options";

                item.options.forEach((opt, optIdx) => {
                    let li = document.createElement("li");
                    let label = document.createElement("label");
                    
                    let input = document.createElement("input");
                    input.type = "radio";
                    input.name = `q${qIdx}`;
                    input.value = optIdx;

                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${labels[optIdx]}. ${opt.text}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                card.appendChild(ul);

                let feedback = document.createElement("div");
                feedback.className = "feedback";
                feedback.id = `f${qIdx}`;
                card.appendChild(feedback);

                container.appendChild(card);
            });
        }

        function checkAnswers() {
            let score = 0;
            let total = processedQuestions.length;
            const labels = ["A", "B", "C", "D"];

            processedQuestions.forEach((item, qIdx) => {
                let selectedOption = document.querySelector(`input[name="q${qIdx}"]:checked`);
                let feedbackDiv = document.getElementById(`f${qIdx}`);
                let cardDiv = document.getElementById(`q${qIdx}-card`);

                let correctOptIndex = item.options.findIndex(opt => opt.isCorrect);
                let correctLabel = labels[correctOptIndex];
                let correctText = item.options[correctOptIndex].text;

                feedbackDiv.style.display = "block";

                if (selectedOption) {
                    let userIndex = parseInt(selectedOption.value);
                    if (item.options[userIndex].isCorrect) {
                        score++;
                        feedbackDiv.className = "feedback correct-feedback";
                        feedbackDiv.innerHTML = `&#10004; Correct! ${item.exp}`;
                        cardDiv.style.borderLeft = "6px solid #2e7d32";
                    } else {
                        feedbackDiv.className = "feedback incorrect-feedback";
                        feedbackDiv.innerHTML = `&#10008; Incorrect. Correct Answer: <strong>${correctLabel}. ${correctText}</strong>.<br><em>${item.exp}</em>`;
                        cardDiv.style.borderLeft = "6px solid #c62828";
                    }
                } else {
                    feedbackDiv.className = "feedback incorrect-feedback";
                    feedbackDiv.innerHTML = `&#9888; Not answered. Correct Answer: <strong>${correctLabel}. ${correctText}</strong>.<br><em>${item.exp}</em>`;
                    cardDiv.style.borderLeft = "6px solid #f57c00";
                }
            });

            let scoreBoard = document.getElementById("score-board");
            scoreBoard.style.display = "block";
            let percentage = Math.round((score / total) * 100);
            scoreBoard.innerHTML = `<h2>Your Total Score: ${score} / ${total} (${percentage}%)</h2>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
